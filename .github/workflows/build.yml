name: test and package

on:
  push:
    branches: ["main", "claude/**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: tests (${{ matrix.os }}, py${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    # A stuck test should fail the job in minutes, not hold a runner for hours.
    # (macOS is the slowest of the three: ~40s for the suite against ~5s
    # elsewhere, so the ceiling has to leave it room.)
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.9", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Run the test suite
        run: python tools/run_tests.py --timeout 240 --verbose
      - name: Run the worker-pool tests
        run: python tools/run_pool_tests.py
      - name: Smoke test the CLI
        shell: bash
        run: |
          python tools/make_sample_log.py sample.csv --rows 20000
          python -m csvinsight info sample.csv
          python -m csvinsight grep sample.csv -w level=ERROR -o errors.csv
          python -m csvinsight convert sample.csv -o out.csv --encoding utf-8-sig --newline crlf

  package:
    name: package (${{ matrix.os }})
    needs: test
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    permissions:
      contents: write        # for the builds/* mirror branches below
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact: csvinsight-windows
            binary: dist/csvinsight.exe
            mirror: builds/windows
          - os: macos-latest
            artifact: csvinsight-macos
            binary: dist/csvinsight
            mirror: builds/macos
          - os: ubuntu-latest
            artifact: csvinsight-linux
            binary: dist/csvinsight
            mirror: ""
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install PyInstaller
        run: python -m pip install --upgrade pyinstaller
      - name: Build
        run: python -m PyInstaller --clean --noconfirm packaging/csvinsight.spec
      - name: Smoke test the executable
        shell: bash
        run: |
          "${{ matrix.binary }}" --version
          python tools/make_sample_log.py sample.csv --rows 20000
          "${{ matrix.binary }}" info sample.csv
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.binary }}
          if-no-files-found: error
      # Actions artifacts can only be fetched through the Actions API, which is
      # not reachable from every environment (an agent sandbox, a locked-down
      # network). Force-pushing the binary onto a throwaway branch makes it
      # reachable with a plain `git fetch` over https, which is.
      # Nothing else depends on these branches -- delete the step and the two
      # branches and the artifacts above still carry every build.
      - name: Mirror the binary to a builds branch
        if: matrix.mirror != ''
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          rm -rf mirror && mkdir mirror
          cp "${{ matrix.binary }}" mirror/
          echo "${{ matrix.artifact }} built from ${GITHUB_SHA} on $(date -u +%Y-%m-%dT%H:%M:%SZ)" > mirror/BUILD.txt
          cd mirror
          git init -q
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -q -b "${{ matrix.mirror }}"
          git add -A
          git commit -qm "${{ matrix.artifact }} from ${GITHUB_SHA}"
          git push -qf "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "${{ matrix.mirror }}"
